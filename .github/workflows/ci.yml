name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 린트·타입·아키텍처는 DB 없이 돈다. 단위 테스트도 마찬가지다 (T1).
  # 빠른 게이트를 먼저 실패시켜 통합 테스트 시간을 낭비하지 않는다.
  static:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.11은 지원 하한이다 (`requires-python = ">=3.11"`).
        # 개발 환경(3.13)에서만 돌리면 하한 전용 문법 오류를 놓친다 —
        # 실제로 `scripts/arch_check.py`의 f-string 백슬래시가 그랬다.
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"

      - name: ruff
        run: python -m ruff check src tests scripts

      - name: mypy
        run: python -m mypy src

      - name: 아키텍처 규칙 (계층·읽기 전용)
        run: python scripts/arch_check.py --ci

      - name: 쓰기 API 호출 검사 (D-005 — arch_check는 메서드명만 본다)
        run: |
          ! grep -rnE "_Task\(|SetField|AddCustomFieldDef|RemoveCustomFieldDef" \
              src/infrastructure/vcenter/ --include="*.py" \
            | grep -v "^\s*#"

      - name: HTTP 클라이언트 미사용 검사 (D-010 — REST 우회 금지)
        run: |
          ! grep -rnE "^\s*(import|from)\s+(httpx|requests|aiohttp)" \
              src/infrastructure/vcenter/ --include="*.py"

      - name: 단위 테스트 (DB 불필요)
        run: python -m pytest tests/unit -q

  integration:
    runs-on: ubuntu-latest
    needs: static
    services:
      postgres:
        # PostgreSQL 17 표준 / 16 하한 (D-013). 하한으로 검증한다.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: portal
          POSTGRES_PASSWORD: devpass
          POSTGRES_DB: wzoneportal
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U portal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: 통합 테스트
        env:
          # conftest가 이 URL에서 `wzoneportal_test` DB를 만들고 Alembic을 돌린다.
          PORTAL_DATABASE_URL: postgresql+asyncpg://portal:devpass@127.0.0.1:5432/wzoneportal
        run: python -m pytest tests/integration -q
