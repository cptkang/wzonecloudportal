<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가상 머신 · 가상자원 인벤토리</title>
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<!-- 폰트: 폐쇄망 배포 시 로컬 호스팅으로 교체 (docs/03_design_system.md §1.3, CST-08) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body data-page="inventory">

<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar__sync" id="sync-status"></div>
    </header>

    <div class="page">
      <div class="page__head">
        <div class="page__titles">
          <h1 class="page__title">가상 머신</h1>
          <div class="page__sub">등록된 연결에서 수집한 가상 머신 목록입니다.</div>
        </div>
        <div class="page__actions">
          <span class="page__count" id="vm-count"></span>
        </div>
      </div>

      <div class="toolbar" id="conn-filter"></div>

      <!-- 표기 규칙 범례 — docs/03_design_system.md §2.
           "해당 없음(하이퍼바이저 미지원)"은 Hyper-V가 들어오는 Step 5에서 추가한다. -->
      <div class="legend">
        <span class="legend__title">표기 규칙</span>
        <span class="legend__item"><span class="state state--value-text">Ubuntu 22.04</span><span>수집된 값</span></span>
        <span class="legend__item"><span class="state state--unavailable">⚠ 수집 불가</span><span>게스트 도구 미설치·중지</span></span>
        <span class="legend__item"><span class="state state--empty">—</span><span>실제로 빈 값</span></span>
      </div>

      <div class="table-wrap">
        <div class="table table--vm">
          <div class="table__head cols-vm">
            <div>이름</div>
            <div>전원</div>
            <div>게스트 OS</div>
            <div style="text-align:right">vCPU</div>
            <div style="text-align:right">메모리</div>
            <div>호스트</div>
            <div>수집 시각</div>
          </div>
          <div id="vm-rows"></div>
        </div>
      </div>

      <div class="pager" id="pager" hidden>
        <span class="pager__pos" id="pager-pos"></span>
        <button type="button" class="btn btn--sm" id="prev-page">이전</button>
        <button type="button" class="btn btn--sm" id="next-page">다음</button>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast" hidden></div>

<script src="js/format.js"></script>
<script src="js/api.js"></script>
<script src="js/shell.js"></script>
<script src="js/resources.js"></script>
</body>
</html>
