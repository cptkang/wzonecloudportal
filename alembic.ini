; NOTE: This file is read with the system locale encoding (cp949 on Korean Windows),
; so it must stay ASCII-only. Korean notes belong in migrations/env.py.
;
; sqlalchemy.url is intentionally absent: migrations/env.py reads PORTAL_DATABASE_URL
; from application settings. Keeping credentials out of a committed file (NFR-203).

[alembic]
script_location = migrations
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
